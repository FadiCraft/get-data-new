name: Scrape Arabic Movies & Series

on:
  schedule:
    - cron: '0 */6 * * *'  # تشغيل تلقائي كل 6 ساعات
  workflow_dispatch:      # إمكانية التشغيل اليدوي بنقرة زر
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # مهم جداً لجلب كامل التاريخ وتجنب مشاكل الدمج

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install playwright playwright-extra puppeteer-extra-plugin-stealth axios
    
    - name: Install Playwright browsers
      run: npx playwright install chromium
    
    - name: Install system dependencies
      run: |
        npx playwright install-deps chromium
    
    - name: Run Scraper Script
      run: node scrape-movies.js
    
    - name: Upload Debug Artifacts (Optional)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-debug-files
        path: |
          posters/
          Movies/
          Series/
        retention-days: 3
    
    - name: Commit and push changes safely
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # عمل جلب لأي تحديثات تمت على السيرفر لتفابل الـ Rejection
        git fetch origin main
        
        # إضافة الملفات والمجلدات الجديدة والقديمة
        git add posters/ Movies/ Series/ *.json || true
        
        # التحقق إذا كان هناك أي تغييرات حقيقية لعمل commit
        if ! git diff --quiet && git diff --staged --quiet; then
          git commit -m "📊 Auto-update movies and series data [skip ci]"
          
          # سحب التعديلات الأخيرة ودمجها ذكياً قبل الدفع لمنع الـ Reject وإصلاح مشكلة الـ fetch first
          git pull origin main --rebase
          
          # الدفع النهائي للسيرفر
          git push origin main
        else
          echo "No changes detected. Skipping commit."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
