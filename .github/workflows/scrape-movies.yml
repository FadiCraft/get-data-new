name: Scrape Arabic Movies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install playwright playwright-extra puppeteer-extra-plugin-stealth
    
    - name: Install Playwright browsers
      run: npx playwright install chromium
    
    - name: Install system dependencies
      run: |
        npx playwright install-deps chromium
    
    - name: Scrape movies (with optional video recording)
      env:
        RECORD_VIDEO: ${{ vars.RECORD_VIDEO || 'false' }} # يمكنك تفعيله من إعدادات المتغيرات
      run: node scrape-movies.js
    
    - name: Upload Debug Screenshots & JSON
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-debug-files
        path: |
          screenshots/
          single_movie_result.json
        retention-days: 2
    
    - name: Upload Videos (if enabled)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-videos
        path: videos/
        retention-days: 2
