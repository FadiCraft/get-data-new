name: Scrape Arabic Movies

on:
  schedule:
    - cron: '0 */6 * * *'  # كل 6 ساعات
  workflow_dispatch:  # تشغيل يدوي
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install playwright @playwright/test
    
    - name: Install Playwright browsers
      run: npx playwright install chromium
    
    - name: Install system dependencies
      run: |
        npx playwright install-deps chromium
    
    - name: Scrape movies
      run: node scrape-movies.js
    
    - name: Upload Debug Screenshots & JSON
      uses: actions/upload-artifact@v4
      if: always() # تضمن رفع الصور والملفات حتى لو فشل السكريبت أو حدث Timeout
      with:
        name: playwright-debug-files
        path: |
          *.png
          single_movie_result.json
          movies_with_servers.json
        retention-days: 5 # الاحتفاظ بالملفات لمدة 5 أيام لتوفير المساحة
    
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # قمت بتحديثها لتشمل أي ملف JSON مستخرج لمنع فشل الخطوة
        git add *.json || true 
        git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-update movies data [skip ci]" && git push)
      env:
        get-data-new: ${{ secrets.GITHUB_TOKEN }}
